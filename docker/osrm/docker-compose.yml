services:
  osrm:
    image: ${OSRM_IMAGE:?Set OSRM_IMAGE to an approved digest-pinned ghcr.io/project-osrm/osrm-backend image}
    command: ["osrm-routed", "--algorithm", "mld", "/data/${OSRM_DATASET:?Set OSRM_DATASET}.osrm"]
    ports:
      - "127.0.0.1:${OSRM_PORT:-5000}:5000"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped

