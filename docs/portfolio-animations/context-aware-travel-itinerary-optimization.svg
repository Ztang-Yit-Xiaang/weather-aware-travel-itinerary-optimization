<svg xmlns="http://www.w3.org/2000/svg" class="project-art" viewBox="0 0 900 480" role="img" aria-labelledby="pm_context_aware_travel_itinerary_optimization_title pm_context_aware_travel_itinerary_optimization_desc">
<title id="pm_context_aware_travel_itinerary_optimization_title">Itinerary repair</title><desc id="pm_context_aware_travel_itinerary_optimization_desc">Illustrative disruption and route repair. Stops, routes and movement are schematic, not live travel data.</desc>
<metadata>Portfolio project illustration. Source: https://github.com/Ztang-Yit-Xiaang/weather-aware-travel-itinerary-optimization. No scientific execution or performance claim. Generated by scripts/generate-project-animations.py.</metadata>
<style>
.project-art{--art-paper:var(--paper,#f7f2e9);--art-ink:var(--ink,#272820);--art-red:var(--red,#a54230);--art-sage:var(--sage,#526451);--art-line:var(--line,#d6ccbd);--art-wash:var(--wash,#eee6d9);font-family:Geist,"Noto Sans TC",Arial,sans-serif}
.project-art text{dominant-baseline:auto}.pointer-layer{transform:translate(var(--pointer-x,0px),var(--pointer-y,0px));transition:transform 500ms cubic-bezier(.22,1,.36,1)}
.art-animate{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:8 12;animation-name:pm_context_aware_travel_itinerary_optimization_flow;animation-timing-function:linear}
.pulse{animation-name:pm_context_aware_travel_itinerary_optimization_pulse}.bob{animation-name:pm_context_aware_travel_itinerary_optimization_bob}.bounce{animation-name:pm_context_aware_travel_itinerary_optimization_bounce}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation-name:pm_context_aware_travel_itinerary_optimization_draw}
.highlight{opacity:0;animation-name:pm_context_aware_travel_itinerary_optimization_highlight}.later{animation-delay:-2.6s}.latest{animation-delay:-5.2s}
.typed{animation-name:pm_context_aware_travel_itinerary_optimization_type;transform-box:fill-box}
@keyframes pm_context_aware_travel_itinerary_optimization_flow{to{stroke-dashoffset:-160}}
@keyframes pm_context_aware_travel_itinerary_optimization_pulse{0%,100%{opacity:.35}40%,70%{opacity:1}}
@keyframes pm_context_aware_travel_itinerary_optimization_bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes pm_context_aware_travel_itinerary_optimization_bounce{0%,100%{transform:translateY(0)}25%{transform:translateY(105px)}50%{transform:translateY(25px)}75%{transform:translateY(125px)}}
@keyframes pm_context_aware_travel_itinerary_optimization_draw{0%,5%,100%{stroke-dashoffset:1}55%,95%{stroke-dashoffset:0}}
@keyframes pm_context_aware_travel_itinerary_optimization_highlight{0%,35%,100%{opacity:0}8%,28%{opacity:1}}
@keyframes pm_context_aware_travel_itinerary_optimization_type{0%,8%,100%{clip-path:inset(0 100% 0 0)}50%,92%{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.art-animate{animation:none!important}.highlight{opacity:1}.pointer-layer{transform:none;transition:none}}
@media(prefers-color-scheme:dark){.project-art{--art-paper:var(--paper,#20221e);--art-ink:var(--ink,#f4ede1);--art-red:var(--red,#e79a80);--art-sage:var(--sage,#b2c3a4);--art-line:var(--line,#686456);--art-wash:var(--wash,#2c2e27)}}
</style>
